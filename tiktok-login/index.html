<!doctype html>
<!-- TikTok login lands here (TIKTOK_REDIRECT_URI). Host it on GitHub Pages:
     see "TikTok login page" in sessioncontextclipfarming.md. Nothing is sent anywhere;
     the page only shows its own address so you can paste it to the ClipFarm bot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ClipFarm login</title>
<style>
  body { font: 17px/1.5 system-ui, sans-serif; background: #111; color: #eee; margin: 0; padding: 24px 16px; }
  main { max-width: 560px; margin: auto; }
  textarea { width: 100%; box-sizing: border-box; height: 120px; font: 13px monospace; background: #222;
             color: #eee; border: 1px solid #444; border-radius: 8px; padding: 10px; }
  button { margin-top: 12px; width: 100%; padding: 14px; font-size: 17px; border: 0; border-radius: 8px;
           background: #fe2c55; color: #fff; }
</style>
</head>
<body>
<main>
  <h1 id="h">Almost done</h1>
  <p id="p">Copy this whole address and send it to the ClipFarm bot in Telegram.</p>
  <textarea id="u" readonly></textarea>
  <button id="b">Copy</button>
</main>
<script>
  var u = document.getElementById("u");
  u.value = location.href;
  if (location.search.indexOf("error=") >= 0) {
    document.getElementById("h").textContent = "TikTok login didn't finish";
    document.getElementById("p").textContent = "Send this to the bot anyway: it says why.";
  }
  document.getElementById("b").onclick = function () {
    u.select();
    (navigator.clipboard ? navigator.clipboard.writeText(u.value) : Promise.reject()).catch(function () {
      document.execCommand("copy");
    });
    this.textContent = "Copied";
  };
</script>
</body>
</html>
